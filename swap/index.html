    <script>
      // 首屏渲染前就定好外观，避免闪一下。和 src/components/common.tsx 的规则一致

        var pref = "auto";
        try {
          var q = new URLSearchParams(location.search).get("theme");
          var saved = JSON.parse(localStorage.getItem("wt-swap:prefs") || "{}");
          pref = q === "dark" || q === "light" ? q : saved.theme || "auto";
        } catch (e) {}
        var dark = pref === "dark" || (pref !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
