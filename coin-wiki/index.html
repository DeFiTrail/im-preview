      (function () {
        try {
          var q = new URLSearchParams(location.search).get("theme");
          var p = JSON.parse(localStorage.getItem("wt-coinwiki:prefs") || "{}");
          var t = q === "dark" || q === "light" ? q : p.theme && p.theme !== "auto" ? p.theme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
          if (p.updown === "cn" || new URLSearchParams(location.search).get("updown") === "cn") document.documentElement.dataset.updown = "cn";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
