<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Walletalk</title>
    <script>
      // 与主界面共用"个人设置 → 外观"的本机偏好（默认跟随系统）
      (function () {
        var mode = "light";
        try {
          var pref = localStorage.getItem("WT_THEME");
          var dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          mode = dark ? "dark" : "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", mode);
      })();
    </script>
    <style>
      html {
        --bg: #f3efe8;
        --ink: #17120c;
        --sub: #6b6358;
        --glow: rgba(243, 137, 23, 0.16);
      }
      html[data-theme="dark"] {
        --bg: #0b0d10;
        --ink: #fff7ec;
        --sub: #948f87;
        --glow: rgba(255, 178, 36, 0.14);
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: transparent;
      }
      /* Electron 启动窗口是 200×200 的透明无边框窗口：内容画在圆角卡片里 */
      .card {
        position: fixed;
        inset: 0;
        border-radius: 24px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: radial-gradient(420px 320px at 50% 44%, var(--glow), transparent 70%), var(--bg);
        color: var(--ink);
        font-family: Outfit, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        cursor: default;
        user-select: none;
        -webkit-app-region: drag;
      }
      .icon {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        box-shadow: 0 12px 32px -8px rgba(232, 96, 10, 0.45);
        animation: rise 560ms cubic-bezier(0.32, 0.72, 0, 1) both;
      }
      .wordmark {
        height: 24px;
        width: auto;
        animation: rise 560ms 80ms cubic-bezier(0.32, 0.72, 0, 1) both;
      }
      .dots {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .dots i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #f38917;
        opacity: 0.25;
        animation: breath 1.2s ease-in-out infinite;
      }
      .dots i:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dots i:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes breath {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .icon,
        .wordmark,
        .dots i {
          animation: none;
        }
        .dots i {
          opacity: 0.6;
        }
      }
    </style>
  </head>
