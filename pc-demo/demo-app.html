<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>样例应用 · Walletalk 演示</title>
    <!-- 演示模式 · 样例应用占位页：在小程序容器里代替第三方应用页面，演示桥接能力（只在 build:demo 中构建） -->
    <script>
      (function () {
        var theme = new URLSearchParams(location.search).get("theme");
        if (theme !== "dark" && theme !== "light")
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <style>
      html { background: #F8F5F0; }
      html[data-theme="dark"] { background: #0F1114; }
    </style>
    <script type="module" crossorigin src="./assets/demo-app-df5f34e4.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/walletalk-tokens-bef170a4.js">

    <link rel="stylesheet" href="./assets/demo-app-a42f6e5a.css">
  </head>
